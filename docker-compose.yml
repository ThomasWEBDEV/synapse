services:
  mysql:
    image: mysql:8.0
    container_name: synapse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: synapse_db
      MYSQL_USER: synapse
      MYSQL_PASSWORD: synapse
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: synapse-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/synapse_db
      SPRING_DATASOURCE_USERNAME: synapse
      SPRING_DATASOURCE_PASSWORD: synapse
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  erp:
    build: ./erp
    container_name: synapse-erp
    ports:
      - "8081:8081"
    environment:
      SYNAPSE_API_URL: http://backend:8080/api/flux
    depends_on:
      backend:
        condition: service_healthy

  jenkins:
    image: jenkins/jenkins:lts
    container_name: synapse-jenkins
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mysql_data:
  jenkins_data:
